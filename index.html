:root{
  --bg:#0A0E14;--bg2:#0F1520;--bg3:#141C28;--surface:#131B27;
  --teal:#00F0B8;--teal2:#2BE4CA;--teal-dk:#007A5E;
  --teal-lt:rgba(0,240,184,.12);--teal-md:rgba(0,240,184,.25);
  --ink:#F0F4F8;--ink2:#CBD5E1;--body:#B8C5D6;--muted:#8FA3B8;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --red:#FF5C5C;--amber:#FFB347;--amber-lt:rgba(255,179,71,.12);
  --mono:"Space Mono",monospace;--sans:"Sora",sans-serif;
  --r:14px;--shadow2:0 8px 48px rgba(0,0,0,.7);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden}
.screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen.active{display:flex}
.auth-bg{background:var(--bg);align-items:center;justify-content:flex-start;padding:16px}
.auth-inner{position:relative;z-index:1;width:100%;max-width:380px;margin:auto}
.auth-card{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:20px 18px;box-shadow:var(--shadow2)}

.logo-container{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:10px;width:100%}
.logo-cadeado-puro{width:46px;height:46px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 8px rgba(0,240,184,0.45))}
.logo-typography{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.logo-mob-tag{font-family:var(--sans);font-size:8px;font-weight:900;color:var(--teal);letter-spacing:1px;align-self:flex-end;margin-right:10px;margin-bottom:-4px}
.logo-title-row{font-family:var(--sans);font-size:19px;font-weight:900;color:#FFFFFF;letter-spacing:-0.4px;text-shadow:0 2px 4px rgba(0,0,0,0.85)}
.logo-sub-bullets{display:flex;align-items:center;gap:4px;margin-top:2px}
.logo-sub-bullets span{font-size:7px;font-weight:800;letter-spacing:1.2px;color:var(--teal);text-transform:uppercase}
.logo-dot{width:3.5px;height:3.5px;background:var(--teal);border-radius:50%}

.app-slogan{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.35;margin-bottom:12px}
.app-slogan em{color:var(--teal);font-style:normal}
.badge{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--teal-lt);border:1px solid var(--teal-md);border-radius:50px;padding:4px 12px;font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.fg{margin-bottom:10px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.fi{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 13px;font-family:var(--mono);font-size:14px;color:var(--ink);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--teal);box-shadow:0 0 10px rgba(0,240,184,0.2)}
.fi.erro{border-color:var(--red)}
.msg-erro{font-size:11px;color:var(--red);text-align:center;min-height:14px;margin-top:6px}
.btn-p{width:100%;background:linear-gradient(135deg,var(--teal-dk),var(--teal));color:#000;border:none;border-radius:50px;padding:13px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.btn-p:disabled{opacity:.5;cursor:wait}
.btn-s{width:100%;background:var(--teal-lt);color:var(--teal);border:1.5px solid var(--teal-md);border-radius:50px;padding:11px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.btn-pdf{width:100%;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:50px;padding:12px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn-wz{width:100%;background:linear-gradient(135deg,#128C7E,#25D366);color:#fff;border:none;border-radius:50px;padding:14px;font-family:var(--sans);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:5px}
.btn-back{background:none;border:none;color:var(--teal);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans)}
